name: Rebuild library.json

on:
  push:
    branches: [main]
    paths:
      - "books/**/*_sources.csv"
      - "books/**/book.json"
      - "books/**/Saved PDFs/**"
      - "build_library.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build library.json from every *_sources.csv
        run: python3 build_library.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.json index.html
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild library.json from CSVs"
          git push
