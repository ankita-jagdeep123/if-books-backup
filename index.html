"id":"AIFP_N009","notes":[{"n":9}],"type":"unlinked","citation":"Vidura was cursed in that though he possessed an extremely high level of knowledge and wisdom and presented it with utter honesty, the people of his time would not believe him. The following words of Vidura are inscribed in letters of gold on a dome of the Indian parliament: “It is no assembly where there are no elders. They are not elders if they do not speak dharma. It is no dharma if there is no truth in it. It is not truth if it is vitiated by deception”. (Mahabharata 5.35.58).","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":9},{"id":"AIFP_N013","notes":[{"n":13}],"type":"unlinked","citation":"I use the terms emotional, aesthetic, and psychological as a single category and interchange these terms freely in applications.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":13},{"id":"AIFP_N014","notes":[{"n":14}],"type":"unlinked","citation":"Machine learning has been around for a while. But its importance has increased recently as the availability of large amounts of data provided the fuel needed for unprecedented success. Conversely, not all traditional AI is based on machine learning.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":14},{"id":"AIFP_N017","notes":[{"n":17}],"type":"unlinked","citation":"Even the best actors appreciate the director’s work in pointing out how they are coming across and suggesting changes and refinements. Public speakers watch themselves in a mirror or record and view their speech to understand their performance more objectively.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":17},{"id":"AIFP_N019","notes":[{"n":19}],"type":"unlinked","citation":"The term emergent property is sometimes used for a property that is present in a collection of individuals but not in the individual members.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":19},{"id":"AIFP_N020","notes":[{"n":20}],"type":"unlinked","citation":"Neural networks in AI were inspired by the structure and function of neurons in biological brains. The ongoing collaboration between neuroscience and computer science is one of the most fruitful alliances today.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":20},{"id":"AIFP_N026","notes":[{"n":26}],"type":"unlinked","citation":"I am indebted to Anurag Kesari for helping develop this section.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":26},{"id":"AIFP_N027","notes":[{"n":27}],"type":"unlinked","citation":"It is therefore no surprise that companies like Apple are now better positioned to track public health with their ability to monitor vital signs including blood oxygen, etc. with user consent.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":27},{"id":"AIFP_N029","notes":[{"n":29}],"type":"unlinked","citation":"Various terms such as AR (Augmented Reality), MR (Mixed Reality) and XR (Extended Reality) are used in the industry to describe these systems. But these hair-splitting differences are likely to blur into a whole continuum of technologies in the near future. I use the term augmented reality to encompass the entire range of these capabilities.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":29},{"id":"AIFP_N030","notes":[{"n":30}],"type":"unlinked","citation":"Very advanced yogis do have the ability to raise their consciousness to such an extent that they become conscious of the subtle mechanisms within their own bodies and even outside their bodies.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":30},{"id":"AIFP_N044","notes":[{"n":44}],"type":"unlinked","citation":"For example, the US Navy is investing in companies such as Leidos, SAIC, AECOM, and Orbital ATK, while the Army’s programs are supported by firms such as SAIC, CACI, Torch Technologies, and Millennium Engineering.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":44},{"id":"AIFP_N053","notes":[{"n":53}],"type":"unlinked","citation":"Zuboff, Surveillance Capitalism, 313.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":53},{"id":"AIFP_N054","notes":[{"n":54}],"type":"unlinked","citation":"Zuboff, Surveillance Capitalism, 8. (Emphasis original).","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":54},{"id":"AIFP_N055","notes":[{"n":55}],"type":"unlinked","citation":"Zuboff, Surveillance Capitalism, 20-21.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":55},{"id":"AIFP_N057","notes":[{"n":57}],"type":"unlinked","citation":"Zuboff, Surveillance Capitalism, 416.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":57},{"id":"AIFP_N059","notes":[{"n":59}],"type":"unlinked","citation":"Zuboff, Surveillance Capitalism, 10.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":59},{"id":"AIFP_N060","notes":[{"n":60}],"type":"unlinked","citation":"Critics would say that this gamification contradicts the fundamental premise that dharmic action should emerge spontaneously from within and not be a project of the ego to get rewards from some external mechanism.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":60},{"id":"AIFP_N067","notes":[{"n":67}],"type":"unlinked","citation":"For instance, my interviews with Ayurvedic doctors giving advice on protection from Covid-19 were rejected. When I finally managed to reach a human employee, I was told that the algorithm probably does not recognize Ayurveda as a legitimate healthcare practice and consequently treated the video as propagating quackery.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":67},{"id":"AIFP_N071","notes":[{"n":71}],"type":"unlinked","citation":"In certain circumstances, telecom carriers could be compelled by courts to breach this freedom.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":71},{"id":"AIFP_N082","notes":[{"n":82}],"type":"unlinked","citation":"DuckDuckGo, which saliently markets itself as being a significantly more privacy-conscious search engine, is one of the emerging dark horses standing up to Google. In November 2019, it achieved over 50 million search queries per day, and by April 2020 was averaging over 61 million per day.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":82},{"id":"AIFP_N083","notes":[{"n":83}],"type":"unlinked","citation":"Platforms also build moats to prevent users from leaving. For example, Facebook does not permit page owners to create an email list of all followers, even threatening to block pages if owners use a third- party tool that allows extraction of followers’ email contacts. Although blatantly monopolistic, the practice has yet to be challenged legally. In effect, these invisible barriers and disincentives serve to enforce loyalty.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":83},{"id":"AIFP_N088","notes":[{"n":88}],"type":"unlinked","citation":"See (1) Muro, Whiton, and Maxim, What Jobs Are Affected by AI? (2) Webb, The Impact of Artificial Intelligence on the Labor Market. (3) Webb et al., Some Facts of High-Tech Patenting.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":88},{"id":"AIFP_N089","notes":[{"n":89}],"type":"unlinked","citation":"There is no evidence that Ned Ludd actually existed, and many scholars speculate that he is a fictional character like Robin Hood to symbolize an idea.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":89},{"id":"AIFP_N146","notes":[{"n":146}],"type":"unlinked","citation":"China silently bought out Germany’s crown jewel, KUKA Robotics, a fact which has attracted much backlash recently. Chinese also own the Segway robotics and mobility company started by American entrepreneur Dean Kamen, founder of FIRST robotics.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":146},{"id":"AIFP_N151","notes":[{"n":151}],"type":"unlinked","citation":"Nvidia has been the chip supplier for AI because it specializes in high-speed math. But the Chinese Ministry of Science and Technology has invested huge sums in private industry with the stated goal of developing a new chip that is twenty times better than Nvidia’s current offerings. Though Silicon Valley remains the leader in chip design, China is working to catch up.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":151},{"id":"AIFP_N190","notes":[{"n":190}],"type":"unlinked","citation":"U.S. Department of Transportation, Preparing for the Future of Transportation, 12.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":190},{"id":"AIFP_N191","notes":[{"n":191}],"type":"unlinked","citation":"U.S. Department of Transportation, Preparing for the Future of Transportation, 16.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":191},{"id":"AIFP_N192","notes":[{"n":192}],"type":"unlinked","citation":"U.S. Department of Transportation, Preparing for the Future of Transportation, 14.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":192},{"id":"AIFP_N194","notes":[{"n":194}],"type":"unlinked","citation":"One may consider emotions as the method by which unconscious mechanisms send messages to consciousness. When a person’s unconscious produces an outcome that it wants the conscious level to address, the unconscious sends a signal that the conscious brain experiences as an emotion. Emotions are raw in the sense that the logical mind has not yet processed and interpreted the signal. While some psychological theories differentiate between emotions and intuition, for the purpose of this book I treat them as one category.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":194},{"id":"AIFP_N197","notes":[{"n":197}],"type":"unlinked","citation":"Companies like Amazon use sentiment analysis to understand customer attitudes toward and feelings about products by analyzing customer review text. This process demonstrates how companies use AI to identify patterns from unstructured data and turn them into structured, actionable insights. Twitter uses advanced text mining techniques to analyze the sentiment of tweets on a given topic at a given time.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":197},{"id":"AIFP_N198","notes":[{"n":198}],"type":"unlinked","citation":"MIT’s Media Lab is a pioneer in these studies.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":198},{"id":"AIFP_N199","notes":[{"n":199}],"type":"unlinked","citation":"An early pioneering example of humans becoming emotionally connected with robots was the Sony Aibo robot dog from the late 1990s and early 2000s. The robotic dog had rudimentary AI that gave it a personality, and Japanese users found it adorable. People held Aibo clinics to maintain their robot dogs in good health, scheduled play dates for them, and often went so far as to hold elaborate ritual funerals for their deceased cyber canine pets.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":199},{"id":"AIFP_N204","notes":[{"n":204}],"type":"unlinked","citation":"Zuboff, Surveillance Capitalism, 411-12.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":204},{"id":"AIFP_N223","notes":[{"n":223}],"type":"unlinked","citation":"For example, patients with type 1 diabetes can wear a device that continuously monitors their blood- sugar level. It is not an implant, but straps to the arm and holds a microneedle in place for an extended time. Patient simply hold a smart phone up to the device to get a reading.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":223},{"id":"AIFP_N224","notes":[{"n":224}],"type":"unlinked","citation":"An entire class of algorithms known as evolutionary (or genetic) algorithms can effectively mimic Darwinian evolutionary processes to iterate over multiple algorithmic generations to find the fittest ones with respect to certain parameters.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":224},{"id":"AIFP_N242","notes":[{"n":242}],"type":"unlinked","citation":"See, for example, Sri Aurobindo, The Life Divine.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":242},{"id":"AIFP_N247","notes":[{"n":247}],"type":"unlinked","citation":"The zamindars in the colonial period acted under the suzerainty of the British Crown and served as a medium to siphon off wealth of the Indian peasants to their colonial masters. Today the British Crown is being replaced by big digital corporations like Google, Facebook etcetera and Indian billionaires have taken the place of zamindars.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":247},{"id":"AIFP_N255","notes":[{"n":255}],"type":"unlinked","citation":"Among numerous other sources, Infinity Foundation’s fourteen-volume series History of Indian Science and Technology is a good starting point to get a glimpse of Indian scientific ingenuity in the past. ww w.InfinityFoundation.com has many of the volumes available.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":255},{"id":"AIFP_N257","notes":[{"n":257}],"type":"unlinked","citation":"It is interesting to note that Indians were highly sought-after migrant workers even many centuries back – Middle East, China.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":257},{"id":"AIFP_N270","notes":[{"n":270}],"type":"unlinked","citation":"For instance, the Chinese technology behemoth Tencent has made at least fifteen technology investments in Indian companies. One startup offers a product that allows students to upload a snapshot of a conceptual problem, and in theory their AI system will provide a video solution in ten seconds. Another product Tencent invested in provides audio content such as audiobooks, stories, podcasts, and self-help content in a variety of Indian languages.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":270},{"id":"AIFP_N294","notes":[{"n":294}],"type":"unlinked","citation":"Rather than a state monopoly being custodian for the data and its equitable marketing, a different approach would be for the government to make and enforce the rules, but let private industry compete in aggregating, managing, and selling the data. To create a level playing field, I propose the approach followed in deregulating the US telecom industry in the 1980s and ’90s. A powerful man named Judge Greene was appointed by the federal court for oversight of the breakup of AT&T. The fundamental principle was to separate the critical bottleneck asset (which was the long-distance backbone network in those days) into a separate private company that would be required to make this asset available equally and impartially to everyone including its own businesses. This was called the Equal Access principle. AT&T, as the owner of this backbone asset would not enjoy any privileged use of it compared to its competitors (like MCI and Sprint in those days). Today’s application of Equal Access to the data industry would be to separate the data aggregating business of Google, Microsoft, Facebook, Amazon, and others, and require it to be made available to all users including a given data aggregator’s own affiliates on equal terms. For instance, all of Google’s data would become a separate business of Google, and the value-added applications of Google and its competitors would have equal access to it without favoring Google’s own access. This means a data-grid would be set up as a separate business and all those selling raw data to it would be treated as arms-length suppliers, and all those buying its data would be treated on par as customers. In principle, every sensor or data capture device could be metered as a supplier to the data-grid. If there are multiple competing data-grids, there could also be a competitive bidding system to value any given raw data. This would lead to competing data curators as intermediaries in the value chain—similar to music licensing companies like ASCAP (American Society of Composers, Authors and Publishers) and other aggregators of intellectual property. This would create three separate and distinct kinds of businesses run on arms-length basis from each other: (1) raw data capture, (2) aggregation and organization of databases, and (3) value- added and sale of applications. The breakup of AT&T along these lines is what unleashed the telecom revolution, internet, and all the internet-based industries that dominate the landscape today.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":294},{"id":"AIFP_N328","notes":[{"n":328}],"type":"unlinked","citation":"Those familiar with Sanskrit taxonomy understand the term sthula-sharira to refer to the physical body of individuals. Here I am addressing the sthula-sharira of the collective body of society in terms of the economy, education, human capital, and issues of unemployment.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":328},{"id":"AIFP_N329","notes":[{"n":329}],"type":"unlinked","citation":"The Sanskrit term sukshma-sharira refers to the psychological and mental body of an individual. My treatment of this level explains the psychological impact of AI both at the level of individuals and the collective.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":329},{"id":"AIFP_N339","notes":[{"n":339}],"type":"unlinked","citation":"Some Indian laws are frequently used to pander to emotional sensitivities. For instance, Indian Penal Code 295A considers it a crime to say something that “insults or attempts to insult the religion or the religious beliefs of that class”. Indian Penal Code 298 considers a crime “uttering any word or making any sound in the hearing or making any gesture or placing any object in the sight of any person, with intention to wound his religious feeling”. I wonder whether such laws have made people too emotionally sensitive at the expense of critical thinking.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":339},{"id":"AIFP_N343","notes":[{"n":343}],"type":"unlinked","citation":"Tamilians are Tamil-speaking people, and Dravidian refers to an identity that was developed in recent times and popularized to put the Tamil speakers in conflict with the north Indians.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":343},{"id":"AIFP_N344","notes":[{"n":344}],"type":"unlinked","citation":"The Indian Constitution has had 104 amendments during the past 73 years of independence, and even now it is considered unstable in some respects. By contrast, the US constitution has been amended a total of 27 times in 233 years.","urls":[],"wayback":[],"googleBooks":"","pdf":"","status":"To do","statusGroup":"todo","firstNote":344}]}]}]}/*FALLBACK_END*/;
</script>
<script>
(function () {
  const app = document.getElementById("app");
  const TYPE_LABEL = { web: "Web pages", book: "Books and reports", social: "Social posts", unlinked: "Notes not yet linked to a source" };
  const ST = { saved: ["Saved copy", "st-saved"], todo: ["To do", "st-todo"], gone: ["No longer online", "st-gone"] };
  let LIB = null;
  const state = { q: "", type: "all", status: "all", sort: "book", homeQ: "" };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const all = (b) => b.groups.flatMap((g) => g.sources);
  const pct = (b) => b.counts.sources ? Math.round(100 * b.counts.savedCopies / b.counts.sources) : 0;
  const hay = (s) => (s.citation + " " + s.urls.join(" ") + " " + s.notes.map((n) => "endnote " + n.n).join(" ")).toLowerCase();

  function sourceCard(s, bookCode, showBook) {
    let [label, cls] = ST[s.statusGroup];
    if (s.statusGroup === "saved" && !s.pdf) label = "Saved, copy being uploaded";
    const notes = s.notes.length
      ? "Cited in the book at: " + s.notes.map((n) => "Endnote " + esc(n.n) + (n.page ? " (p. " + esc(n.page) + ")" : "")).join(", ")
      : "Listed in the book's bibliography (no endnote points to it).";
    const b = [];
    if (s.pdf && s.statusGroup !== "gone") b.push(`<a class="btn primary" href="${esc(s.pdf)}" target="_blank" rel="noopener">Open saved copy (PDF)</a>`);
    if (s.statusGroup !== "gone") s.urls.forEach((u, i) => b.push(`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Original web address${s.urls.length > 1 ? " " + (i + 1) : ""}</a>`));
    s.wayback.forEach((u, i) => b.push(`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Wayback copy${s.wayback.length > 1 ? " " + (i + 1) : ""}</a>`));
    if (s.googleBooks) b.push(`<a class="btn" href="${esc(s.googleBooks)}" target="_blank" rel="noopener noreferrer">Google Books</a>`);
    return `<article class="source">
      ${showBook ? `<div class="hit-book"><a href="#/book/${esc(bookCode)}">${esc(showBook)}</a></div>` : ""}
      <p class="cite">${esc(s.citation)}</p>
      <p class="where"><span class="status ${cls}">${label}</span>${notes}</p>
      ${b.length ? `<div class="btns">${b.join("")}</div>` : ""}
      ${s.pdf && s.statusGroup !== "gone" ? `<p class="pdfnote">The PDF's first page is a cover sheet added by the archive. The saved copy itself starts on page 2.</p>` : ""}
    </article>`;
  }

  function home() {
    document.title = "Infinity Foundation: Book Sources Archive";
    app.innerHTML = `<h1>Book Sources Archive</h1>
      <p class="lede">Every source cited in Rajiv Malhotra's books, listed book by book with the endnotes that cite it. Where possible, the Infinity Foundation keeps its own saved copy of each source, so it can still be read if the original page changes or disappears.</p>
      <input type="search" id="hq" placeholder="Search all books: author, title, website or endnote number" value="${esc(state.homeQ)}" aria-label="Search all books" />
      <div id="hres"></div>`;
    const q = document.getElementById("hq");
    q.addEventListener("input", () => { state.homeQ = q.value; renderHome(); });
    renderHome();
  }
  function renderHome() {
    const q = state.homeQ.trim().toLowerCase(), el = document.getElementById("hres");
    if (!q) {
      el.innerHTML = `<div class="books">${LIB.books.map((b) => `<a class="book-card" href="#/book/${esc(b.code)}">
        <h3>${esc(b.title)}</h3><div class="by">${esc(b.author || "")}${b.year ? " · " + esc(b.year) : ""}</div>
        <div class="small"><b>${b.counts.sources}</b> sources · <b>${b.counts.savedCopies}</b> with a saved copy</div>
        <div class="bar" role="progressbar" aria-valuenow="${pct(b)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct(b)}%"></i></div>
        <div class="small">${pct(b)}% saved</div></a>`).join("")}</div>`;
      return;
    }
    const hits = LIB.books.flatMap((b) => all(b).filter((s) => hay(s).includes(q)).map((s) => [b, s]));
    el.innerHTML = `<p class="small" style="margin-top:14px">${hits.length} matching source${hits.length === 1 ? "" : "s"}</p>` +
      (hits.slice(0, 200).map(([b, s]) => sourceCard(s, b.code, b.title)).join("") || `<p class="empty">No sources match.</p>`);
  }

  function book(code) {
    const b = LIB.books.find((x) => x.code === code);
    if (!b) { app.innerHTML = `<p class="empty">Book not found. <a href="#/">Back to all books</a></p>`; return; }
    document.title = b.title + " · Sources";
    const c = b.counts;
    const typeChips = [["all", "All types"]].concat(b.groups.map((g) => [g.type, g.heading]));
    app.innerHTML = `<div class="crumbs"><a href="#/">All books</a> › ${esc(b.code)}</div>
      <h1>${esc(b.title)}</h1><div class="small">${esc(b.author || "")}${b.publisher ? " · " + esc(b.publisher) : ""}${b.year ? " · " + esc(b.year) : ""}</div>
      <div class="stats">
        <div class="stat"><b>${c.sources}</b><span>Sources (${c.endnotes} endnotes)</span></div>
        <div class="stat"><b>${c.savedCopies}</b><span>Saved copies online${c.saved > c.savedCopies ? " (" + c.saved + " saved in total)" : ""}</span></div>
        <div class="stat"><b>${c.todo}</b><span>Still to do</span></div>
        <div class="stat"><b>${c.gone}</b><span>No longer online</span></div>
      </div>
      <div class="tools">
        <input type="search" id="bq" placeholder="Search this book's sources" value="${esc(state.q)}" aria-label="Search this book" />
        <div class="chips" id="tchips"><span class="label">Type:</span>${typeChips.map(([v, l]) => `<button class="chip" data-t="${v}" aria-pressed="${state.type === v}">${esc(l)}</button>`).join("")}</div>
        <div class="chips" id="schips"><span class="label">Status:</span>${[["all", "All"], ["saved", "Saved copy"], ["todo", "To do"], ["gone", "No longer online"]].map(([v, l]) => `<button class="chip" data-s="${v}" aria-pressed="${state.status === v}">${l}</button>`).join("")}
          <span class="label" style="margin-left:auto">Sort:</span><select id="sort" aria-label="Sort"><option value="book">Book order</option><option value="az">A–Z</option></select></div>
      </div><div id="list"></div>`;
    document.getElementById("sort").value = state.sort;
    document.getElementById("bq").addEventListener("input", (e) => { state.q = e.target.value; list(b); });
    document.getElementById("sort").addEventListener("change", (e) => { state.sort = e.target.value; list(b); });
    app.querySelectorAll("[data-t]").forEach((x) => x.addEventListener("click", () => { state.type = x.dataset.t; app.querySelectorAll("[data-t]").forEach((y) => y.setAttribute("aria-pressed", y === x)); list(b); }));
    app.querySelectorAll("[data-s]").forEach((x) => x.addEventListener("click", () => { state.status = x.dataset.s; app.querySelectorAll("[data-s]").forEach((y) => y.setAttribute("aria-pressed", y === x)); list(b); }));
    list(b);
  }
  function list(b) {
    const q = state.q.trim().toLowerCase();
    let html = "", n = 0;
    b.groups.forEach((g) => {
      if (state.type !== "all" && g.type !== state.type) return;
      let items = g.sources.filter((s) => (state.status === "all" || s.statusGroup === state.status) && (!q || hay(s).includes(q)));
      if (state.sort === "az") items = items.slice().sort((a, c) => a.citation.localeCompare(c.citation));
      if (!items.length) return;
      n += items.length;
      html += `<h2 class="group">${esc(g.heading)} <span>${items.length}</span></h2>` + items.map((s) => sourceCard(s, b.code)).join("");
    });
    document.getElementById("list").innerHTML = html || `<p class="empty">No sources match these filters.</p>`;
  }

  function route() {
    const m = location.hash.match(/^#\/book\/([^/?]+)/);
    if (m) { state.q = ""; book(decodeURIComponent(m[1])); } else home();
    window.scrollTo(0, 0);
  }
  function boot(data) {
    LIB = data;
    app.insertAdjacentHTML("afterend", "");
    window.addEventListener("hashchange", route);
    route();
    document.body.insertAdjacentHTML("beforeend", `<div class="wrap" style="padding-top:0"><footer>Updated ${esc(data.meta.updated)}. Saved copies are kept for research and reference. Original links may have changed since the book was published.</footer></div>`);
  }
  fetch("library.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw 0; return r.json(); })
    .then(boot).catch(() => boot(window.LIBRARY_FALLBACK));
})();
</script>
</body>
